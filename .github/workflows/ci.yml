name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step on purpose: the project has no dependencies, and adding one would send
      # Tinycast's installer down the `ray build` path instead of this project's build script.
      - run: npm test
